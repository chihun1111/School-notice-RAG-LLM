    label: 일반공지
    category: 경동알림
    url: https://www.kduniv.ac.kr/kor/CMS/Board/Board.do?mCode=MN245
  - id: academic
    label: 학사공지
    category: 경동알림
    url: https://www.kduniv.ac.kr/kor/CMS/Board/Board.do?mCode=MN246
  - id: scholarship
    label: 장학공지
    category: 경동알림
    url: https://www.kduniv.ac.kr/kor/CMS/Board/Board.do?mCode=MN284
  - id: center
    label: 센터공지
    category: 경동알림
    url: https://www.kduniv.ac.kr/kor/CMS/Board/Board.do?mCode=MN285
  - id: career
    label: 취업공지
    category: 경동알림
    url: https://www.kduniv.ac.kr/kor/CMS/Board/Board.do?mCode=MN286
  - id: recruiting
    label: 채용공지
